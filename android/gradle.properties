# -Duser.language/-Duser.country: bundletool formats dex file indices with the
# JVM locale, so on a Windows set to Arabic `bundleRelease` fails with "Invalid
# dex file indices, expecting file classes?.dex". Pinning the Gradle JVM to
# English fixes it (verified on this machine); it does not change the app language.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.compiler.execution.strategy=in-process
